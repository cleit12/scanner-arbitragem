<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Arbitragem DEX — Dados Reais</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
        body{background:#121212;color:#e0e0e0;padding:20px;max-width:1400px;margin:0 auto;}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px;flex-wrap:wrap;gap:15px;}
        .status{display:flex;align-items:center;gap:8px;}
        .dot{width:12px;height:12px;border-radius:50%;background:#4caf50;animation:pulse 2s infinite;}
        .dot.off{background:#f44336;}
        @keyframes pulse{0%{opacity:1;}50%{opacity:0.4;}100%{opacity:1;}}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:30px;}
        .card{background:#1e1e1e;padding:20px;border-radius:10px;border:1px solid #333;}
        .card h3{font-size:14px;color:#9e9e9e;margin-bottom:8px;}
        .card .value{font-size:24px;font-weight:bold;color:#4caf50;}
        .controls{margin-bottom:20px;display:flex;gap:15px;flex-wrap:wrap;align-items:center;}
        input,button{padding:8px 12px;border-radius:5px;border:1px solid #444;}
        button{background:#4caf50;color:#fff;border:none;font-weight:bold;cursor:pointer;}
        button:disabled{background:#555;cursor:not-allowed;opacity:0.7;}
        table{width:100%;border-collapse:collapse;background:#1e1e1e;border-radius:10px;overflow:hidden;}
        th,td{padding:12px 15px;text-align:left;border-bottom:1px solid #333;}
        th{background:#2d2d2d;color:#fff;}
        tr:hover{background:#252525;}
        .loading{text-align:center;padding:40px;color:#999;}
        .error{color:#ff6b6b;background:#2d1f1f;padding:15px;border-radius:8px;margin:15px 0;}
        .net-badge{padding:3px 8px;border-radius:12px;font-size:12px;font-weight:bold;}
        .sol{background:#00ffa320;color:#00ffa3;}
        .bsc{background:#f3ba2f20;color:#f3ba2f;}
        .eth{background:#627eea20;color:#627eea;}
        .pol{background:#8247e520;color:#8247e5;}
        .profit-positive{color:#4caf50;font-weight:bold;}
        .last-update{font-size:12px;color:#777;margin-top:5px;}
    </style>
</head>
<body>
    <div class="header">
        <h1>🔍 Scanner de Arbitragem DEX — Dados Reais</h1>
        <div class="status">
            <span class="dot" id="statusDot"></span>
            <span id="statusText">Pronto</span>
        </div>
    </div>

    <div class="controls">
        <label>Lucro Mínimo (%):</label>
        <input type="number" id="minProfit" value="0.5" step="0.1" style="width:70px;">
        <button id="btnAtualizar" onclick="buscarDados()">🔄 Buscar Dados Reais</button>
        <span style="font-size:13px;color:#999;">Fonte: DEX Screener API</span>
    </div>

    <div id="mensagem" class="error" style="display:none;"></div>

    <div class="stats">
        <div class="card">
            <h3>Pares Analisados</h3>
            <div class="value" id="totalPairs">0</div>
        </div>
        <div class="card">
            <h3>Oportunidades ≥ Mínimo</h3>
            <div class="value" id="totalOpp">0</div>
        </div>
        <div class="card">
            <h3>Maior Lucro Encontrado</h3>
            <div class="value" id="maxProfit">0%</div>
        </div>
        <div class="card">
            <h3>Última Atualização</h3>
            <div class="value" id="lastTime" style="font-size:16px;">--:--</div>
        </div>
    </div>

    <h2 style="margin-bottom:15px;">Oportunidades de Arbitragem</h2>
    <div style="overflow-x:auto;">
        <table>
            <thead>
                <tr>
                    <th>Rede</th>
                    <th>Par</th>
                    <th>Preço (USD)</th>
                    <th>Variação 5min (%)</th>
                    <th>Link</th>
                </tr>
            </thead>
            <tbody id="tabelaDados">
                <tr><td colspan="5" class="loading">Clique em "Buscar Dados Reais" para começar...</td></tr>
            </tbody>
        </table>
    </div>

<script>
const PARES = [
    {chain:'solana', pair:'So11111111111111111111111111111111111111112/EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v', name:'SOL/USDC'},
    {chain:'bsc', pair:'0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c/0x55d398326f99059fF775485246999027B3197955', name:'BNB/USDT'},
    {chain:'ethereum', pair:'0xC02aaA39b223FE8D0A0e5C4F27eAD9083e65C4CC/0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48', name:'ETH/USDC'},
    {chain:'polygon', pair:'0x7ceB23fD6bC0adD59E62ac25578270cffB97D31f/0x2791Bca1f2de4661ED88A30C99A7a9449Aa84174', name:'ETH/USDC'}
];

const NOMES_REDES = {
    solana: {nome: 'Solana', classe: 'sol'},
    bsc: {nome: 'BSC', classe: 'bsc'},
    ethereum: {nome: 'Ethereum', classe: 'eth'},
    polygon: {nome: 'Polygon', classe: 'pol'}
};

let buscando = false;

async function buscarDados() {
    if (buscando) return;
    buscando = true;
    
    const btn = document.getElementById('btnAtualizar');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const mensagem = document.getElementById('mensagem');
    const tabela = document.getElementById('tabelaDados');
    const minProfit = parseFloat(document.getElementById('minProfit').value) || 0.5;
    
    btn.disabled = true;
    btn.textContent = "Buscando...";
    statusText.textContent = "Conectando...";
    statusDot.className = "dot";
    mensagem.style.display = 'none';
    tabela.innerHTML = '<tr><td colspan="5" class="loading">Buscando dados reais do DEX Screener...</td></tr>';
    
    const resultados = [];
    let erros = 0;
    
    for (const par of PARES) {
        try {
            const proxyUrl = 'https://corsproxy.io/?';
            const apiUrl = `https://api.dexscreener.com/latest/dex/pairs/${par.chain}/${par.pair}`;
            const resposta = await fetch(proxyUrl + encodeURIComponent(apiUrl));
            
            if (!resposta.ok) throw new Error(`Erro: ${resposta.status}`);
            
            const dados = await resposta.json();
            
            if (dados && dados.pair) {
                const precoAtual = parseFloat(dados.pair.priceUsd) || 0;
                const variacao = parseFloat(dados.pair.priceChange?.m5) || 0;
                
                resultados.push({
                    rede: par.chain,
                    nome: par.name,
                    preco: precoAtual,
                    variacao: variacao,
                    url: dados.pair.url || ''
                });
            }
            
            await new Promise(r => setTimeout(r, 300));
            
        } catch (erro) {
            console.log(`Erro em ${par.name}:`, erro);
            erros++;
        }
    }
    
    atualizarTela(resultados, minProfit, erros);
    
    btn.disabled = false;
    btn.textContent = "🔄 Buscar Dados Reais";
    buscando = false;
}

function atualizarTela(dados, minProfit, erros) {
    const tabela = document.getElementById('tabelaDados');
    const agora = new Date().toLocaleTimeString('pt-BR');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const mensagem = document.getElementById('mensagem');
    
    document.getElementById('totalPairs').textContent = dados.length;
    document.getElementById('lastTime').textContent = agora;
    
    if (erros > 0 && dados.length === 0) {
        statusDot.className = "dot off";
        statusText.textContent = "Parcialmente indisponível";
        mensagem.textContent = "Algumas redes não responderam. Tente novamente em instantes.";
        mensagem.style.display = 'block';
    } else {
        statusDot.className = "dot";
        statusText.textContent = "Dados atualizados";
    }
    
    const oportunidades = dados.filter(d => Math.abs(d.variacao) >= minProfit);
    document.getElementById('totalOpp').textContent = oportunidades.length;
    
    if (dados.length > 0) {
        const maxVar = Math.max(...dados.map(d => Math.abs(d.variacao)));
        document.getElementById('maxProfit').textContent = maxVar.toFixed(2) + '%';
    } else {
        document.getElementById('maxProfit').textContent = '0%';
    }
    
    if (dados.length === 0) {
        tabela.innerHTML = '<tr><td colspan="5" class="loading">Nenhum dado retornado. Tente novamente.</td></tr>';
        return;
    }
    
    tabela.innerHTML = dados.map(item => {
        const redeInfo = NOMES_REDES[item.rede];
        const classeVar = item.variacao >= 0 ? 'profit-positive' : 'color:#ff6b6b;';
        return `
        <tr>
            <td><span class="net-badge ${redeInfo.classe}">${redeInfo.nome}</span></td>
            <td><strong>${item.nome}</strong></td>
            <td>$${item.preco.toFixed(6)}</td>
            <td style="${classeVar}">${item.variacao >= 0 ? '+' : ''}${item.variacao.toFixed(2)}%</td>
            <td><a href="${item.url}" target="_blank" style="color:#4caf50;text-decoration:none;">Ver ↗</a></td>
        </tr>
        `;
    }).join('');
}
</script>
</body>
</html>
